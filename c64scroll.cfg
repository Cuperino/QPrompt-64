# cc65 linker configuration for C64 .prg
# Produces a file with 2-byte load address ($0801) followed by program data.

MEMORY {
    ZP:       start = $0002, size = $001E, type = rw;
    LOADADDR: start = $07FF, size = $0002, file = %O;
    MAIN:     start = $0801, size = $97FF, file = %O, fill = yes;
    DOCMEM:   start = $A000, size = $5800, type = rw;
}

SEGMENTS {
    ZEROPAGE: load = ZP,       type = zp;
    LOADADDR: load = LOADADDR, type = ro;
    STARTUP:  load = MAIN,     type = ro;
    CODE:     load = MAIN,     type = ro;
    SPRITES:  load = MAIN,     type = ro, start = $3700;
    CHARSET:  load = MAIN,     type = ro, start = $3800;
    SCROLL:   load = MAIN,     type = ro, start = $4000;
    RODATA:   load = MAIN,     type = ro;
    BSS:      load = DOCMEM,   type = bss;
}
